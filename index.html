<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>AR Mascot</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: rgba(0,0,0,0.7);
      color: white;

      padding: 10px 20px;
      border-radius: 10px;

      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="info">
    กำลังโหลด AR...
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./gg.mind;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img
        id="mascot"
        src="./cepar.png"
        crossorigin="anonymous">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- มาสคอต PNG -->
      <a-image
        id="mascotObject"
        src="#mascot"
        position="0 -0.25 0.05"
        width="0.35"
        height="0.6"
        material="transparent: true">
      </a-image>

    </a-entity>

  </a-scene>

  <script>

    const scene =
      document.querySelector("a-scene");

    const info =
      document.getElementById("info");

    scene.addEventListener(
      "loaded",
      function() {

        info.innerHTML =
          "อนุญาตให้ใช้กล้อง แล้วส่องไปที่ป้าย";

      }
    );

  </script>

</body>
</html>
