<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR Mascot Camera</title>
    <!-- โหลดไลบรารีเวอร์ชันเสถียรผ่าน CDN ที่ปลอดภัย -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <script src="https://hertzen.com"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        /* หน้าจอเลือกตัวละคร */
        #selection-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .btn-select {
            padding: 15px 30px; margin: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 25px; background: #007bff; color: white; box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        /* ปุ่มควบคุม */
        #ui-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 20px; align-items: center; }
        .control-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: white; font-size: 20px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; }
        #capture-btn { background: #ff4757; color: white; width: 65px; height: 65px; font-size: 26px; box-shadow: 0 4px 15px rgba(255,71,87,0.4); }
    </style>
</head>
<body>

    <!-- 1. หน้าจอเลือกตัวละคร -->
    <div id="selection-screen">
        <h2 style="color: white; margin-bottom: 20px; text-align: center;">เลือกตัวละครมาสคอต</h2>
        <button class="btn-select" onclick="selectMascot('mascot1')">ตัวละครที่ 1</button>
        <button class="btn-select" onclick="selectMascot('mascot2')">ตัวละครที่ 2</button>
    </div>

    <!-- 2. ปุ่มควบคุมบนหน้าจอ -->
    <div id="ui-container" style="display: none;">
        <button class="control-btn" onclick="adjustSize(0.1)">➕</button>
        <button class="control-btn" id="capture-btn" onclick="takeSnapshot()">📸</button>
        <button class="control-btn" onclick="adjustSize(-0.1)">➖</button>
    </div>

    <!-- 3. ส่วนแสดงผล AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;" vr-mode-ui="enabled: false">
        
        <!-- 💡 ใส่ชื่อไฟล์รูปภาพ PNG ของคุณที่นี่ -->
        <a-assets>
            <img id="image1" src="cepar.png">
            <img id="image2" src="cepar.png">
        </a-assets>

        <!-- ตัวรองรับรูปภาพ PNG (ปรับให้อยู่ระดับสายตาพอดี) -->
        
            <a-image id="active-mascot" src="" width="1" height="1" material="transparent: true; shader: flat; side: double;"></a-image>
        

        
    </a-scene>

    <script>
        let currentScale = 15;
        const mascotContainer = document.getElementById('mascot-container');
        const activeMascot = document.getElementById('active-mascot');

        // รีเควสขอเปิดกล้องทันทีที่โหลดหน้าเว็บเพื่อป้องกันจอขาว
        window.addEventListener('load', () => {
            navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => { console.log("เข้าถึงกล้องสำเร็จ"); })
            .catch((err) => { alert("กรุณาอนุญาตให้เข้าถึงกล้องถ่ายรูป เพื่อใช้งานระบบ AR ครับ"); });
        });

        function selectMascot(type) {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'flex';
            mascotContainer.style.display = 'block';

            if (type === 'mascot1') {
                activeMascot.setAttribute('src', '#image1');
            } else {
                activeMascot.setAttribute('src', '#image2');
            }
        }

        function adjustSize(amount) {
            currentScale += (amount * 10);
            if(currentScale < 2) currentScale = 2; 
            mascotContainer.setAttribute('scale', `${currentScale} ${currentScale} 1`);
        }

        // ระบบลากนิ้วเลื่อนตำแหน่งตัวละครแบบสัมผัสบนมือถือ
        let isDragging = false;
        let previousTouchPosition = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            let deltaX = e.touches[0].clientX - previousTouchPosition.x;
            let deltaY = e.touches[0].clientY - previousTouchPosition.y;

            let currentPos = mascotContainer.getAttribute('position');
            mascotContainer.setAttribute('position', {
                x: currentPos.x + (deltaX * 0.05),
                y: currentPos.y - (deltaY * 0.05),
                z: currentPos.z
            });

            previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        function takeSnapshot() {
            document.getElementById('ui-container').style.display = 'none';
            setTimeout(() => {
                html2canvas(document.body).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'mascot-snapshot.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    document.getElementById('ui-container').style.display = 'flex';
                });
            }, 300);
        }
    </script>
</body>
</html>
