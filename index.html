<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mascot Photo Camera</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* กล้องวิดีโอสด */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* ตัวละครมาสคอตที่ลากวางได้ */
        #mascot-element { 
            position: absolute; top: 35%; left: 35%; width: 150px; height: auto; 
            z-index: 5; cursor: move; user-select: none; touch-action: none; display: none;
        }

        /* เมนูเลือกตัวละครตอนเริ่มต้น */
        #selection-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 99;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .btn-select {
            padding: 15px 30px; margin: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 25px; background: #007bff; color: white; box-shadow: 0 4px 10px rgba(0,123,255,0.4);
        }

        /* แผงปุ่มควบคุม */
        #ui-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 20px; align-items: center; }
        .control-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: white; font-size: 20px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; }
        #capture-btn { background: #ff4757; color: white; width: 68px; height: 68px; font-size: 28px; box-shadow: 0 4px 15px rgba(255,71,87,0.5); }
        
        /* ซ่อน Canvas รับภาพตอนเซฟ */
        #merge-canvas { display: none; }
    </style>
</head>
<body>

    <!-- 1. ตัวเล่นกล้องสดหลังจอ -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- 2. ตัวละคร PNG ที่แสดงบนหน้าจอ -->
    <img id="mascot-element" src="" alt="Mascot">

    <!-- 3. หน้าจอเลือกตัวละครเริ่มต้น -->
    <div id="selection-screen">
        <h2 style="color: white; margin-bottom: 25px; text-align: center; letter-spacing: 1px;">เลือกตัวละครมาสคอต</h2>
        <!-- 💡 ใส่ชื่อไฟล์รูปภาพ PNG ของคุณที่ปุ่มตรงนี้ได้เลย -->
        <button class="btn-select" onclick="startCamera('love.png')">Mr.Love</button>
        <button class="btn-select" onclick="startCamera('like.png')">Mr.Like</button>
        <button class="btn-select" onclick="startCamera('pml.png')">Mr.Pomelo</button>
        <button class="btn-select" onclick="startCamera('cc.png')">Mr.Cocoa</button>
        <button class="btn-select" onclick="startCamera('mon.png')">Mr.Mulberry</button>
        <button class="btn-select" onclick="startCamera('p.png')">Mr.Egg drop</button>
    </div>

    <!-- 4. แผงควบคุม (ย่อขยาย / ถ่ายรูป) -->
    <div id="ui-container" style="display: none;">
        <button class="control-btn" onclick="adjustSize(1.1)">➕</button>
        <button class="control-btn" id="capture-btn" onclick="takeSnapshot()">📸</button>
        <button class="control-btn" onclick="adjustSize(0.9)">➖</button>
    </div>

    <!-- Canvas สำหรับประมวลผลรูปถ่าย (รวมร่างกล้อง + ตัวมาสคอต) -->
    <canvas id="merge-canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const mascot = document.getElementById('mascot-element');
        const selectionScreen = document.getElementById('selection-screen');
        const uiContainer = document.getElementById('ui-container');
        const canvas = document.getElementById('merge-canvas');

        let currentWidth = 150; // ขนาดเริ่มต้นมาสคอต (พิกเซล)

        // ฟังก์ชันเริ่มต้นระบบกล้องและเลือกตัวละคร
        async function startCamera(imageSrc) {
            try {
                // เรียกเปิดกล้องมือถือ/คอมพิวเตอร์
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }, // บังคับใช้กล้องหลังมือถือ
                    audio: false
                });
                video.srcObject = stream;
                
                // ตั้งค่ารูปภาพตัวละคร
                mascot.src = imageSrc;
                mascot.style.display = "block";
                
                // สลับการแสดงผลหน้าจอ
                selectionScreen.style.display = "none";
                uiContainer.style.display = "flex";
            } catch (err) {
                alert("ไม่สามารถเข้าถึงกล้องได้: กรุณาอนุญาตสิทธิ์การเข้าถึงกล้องถ่ายรูป หรือตรวจสอบว่าเว็บของคุณเป็น HTTPS แล้ว");
                console.error(err);
            }
        }

        // ฟังก์ชัน ย่อ - ขยาย ขนาดมาสคอต
        function adjustSize(factor) {
            currentWidth = currentWidth * factor;
            if(currentWidth < 50) currentWidth = 50; // ล็อกขนาดเล็กสุด
            if(currentWidth > 500) currentWidth = 500; // ล็อกขนาดใหญ่สุด
            mascot.style.width = currentWidth + "px";
        }

        // ระบบจับนิ้วลาก/เมาส์ลากย้ายตำแหน่งมาสคอตแบบอิสระบนจอ
        let isDragging = false;
        let offsetX, offsetY;

        mascot.addEventListener('pointerdown', (e) => {
            isDragging = true;
            offsetX = e.clientX - mascot.offsetLeft;
            offsetY = e.clientY - mascot.offsetTop;
            mascot.setPointerCapture(e.pointerId);
        });

        mascot.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;
            
            // จำกัดพื้นที่ไม่ให้ลากทะลุขอบจอ
            if(x < 0) x = 0;
            if(y < 0) y = 0;
            if(x > window.innerWidth - mascot.clientWidth) x = window.innerWidth - mascot.clientWidth;
            if(y > window.innerHeight - mascot.clientHeight) y = window.innerHeight - mascot.clientHeight;

            mascot.style.left = x + 'px';
            mascot.style.top = y + 'px';
        });

        mascot.addEventListener('pointerup', (e) => {
            isDragging = false;
            mascot.releasePointerCapture(e.pointerId);
        });

        // 📸 ฟังก์ชันรวมภาพและแคปภาพหน้าจอลงเครื่องอัตโนมัติ
        function takeSnapshot() {
            // ตั้งค่าขนาด Canvas ให้ตรงกับขนาดหน้าจอจริงที่ผู้ใช้เห็น
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');

            // 1. วาดรูปจากกล้องวิดีโอสดลงไปใน Canvas ก่อน
            // คำนวณแบบ object-fit: cover เพื่อไม่ให้ภาพกล้องบดบังบิดเบี้ยว
            let videoWidth = video.videoWidth;
            let videoHeight = video.videoHeight;
            let screenRatio = canvas.width / canvas.height;
            let videoRatio = videoWidth / videoHeight;
            let sx, sy, sw, sh;

            if (videoRatio > screenRatio) {
                sh = videoHeight;
                sw = videoHeight * screenRatio;
                sx = (videoWidth - sw) / 2;
                sy = 0;
            } else {
                sw = videoWidth;
                sh = videoWidth / screenRatio;
                sx = 0;
                sy = (videoHeight - sh) / 2;
            }
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

            // 2. วาดตัวละครมาสคอตทับลงไปตามพิกเซลที่ลากวางไว้เป๊ะๆ
            const mascotImg = new Image();
            mascotImg.src = mascot.src;
            mascotImg.onload = function() {
                ctx.drawImage(
                    mascotImg, 
                    mascot.offsetLeft, 
                    mascot.offsetTop, 
                    mascot.clientWidth, 
                    mascot.clientHeight
                );

                // 3. แปลงข้อมูล Canvas ออกมาเป็นไฟล์ภาพแล้วดาวน์โหลดลงเครื่องทันที
                const dataUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'mascot-photo-' + Date.now() + '.png'; // ตั้งชื่อรูปภาพตามเวลาที่กดถ่าย
                link.href = dataUrl;
                link.click();
            };
        }
    </script>
</body>
</html>
