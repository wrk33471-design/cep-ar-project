<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AR Mascot</title>

<!-- A-Frame -->
<script src="gg.mind"></script>

<!-- MindAR -->
<script src="cepar.png"></script>

<style>

html,
body {

margin: 0;
padding: 0;

width: 100%;
height: 100%;

overflow: hidden;

font-family: Arial, sans-serif;

}

#ui {

position: fixed;

top: 20px;
left: 50%;

transform: translateX(-50%);

z-index: 1000;

background: rgba(0,0,0,0.7);

color: white;

padding: 12px 18px;

border-radius: 15px;

text-align: center;

font-size: 16px;

}

#controls {

position: fixed;

bottom: 20px;

left: 50%;

transform: translateX(-50%);

z-index: 1000;

display: flex;

gap: 10px;

}

button {

border: none;

border-radius: 12px;

padding: 12px 18px;

font-size: 16px;

background: white;

cursor: pointer;

}

</style>

</head>


<body>


<div id="ui">

ส่องกล้องไปที่ป้าย A2

</div>


<div id="controls">

<button onclick="resizeMascot(1.1)">
➕ ใหญ่ขึ้น
</button>

<button onclick="resizeMascot(0.9)">
➖ เล็กลง
</button>

<button onclick="resetMascot()">
รีเซ็ต
</button>

</div>


<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
filterMinCF: 0.0001;
filterBeta: 0.001;
uiLoading: no;
uiScanning: no;
"

embedded

color-space="sRGB"

renderer="
colorManagement: true;
precision: high;
alpha: true;
"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="
enabled: false;
">


<a-assets>

<img

id="mascot"

src="./mascot.png"

crossorigin="anonymous">

</a-assets>


<a-camera

position="0 0 0"

look-controls="enabled: false"

cursor="
rayOrigin: mouse;
fuse: false;
"

raycaster="
objects: .clickable;
">

</a-camera>


<a-entity

mindar-image-target="targetIndex: 0">


<!-- พื้นที่ป้าย -->

<a-plane

id="poster"

position="0 0 0"

width="1"

height="1"

material="
transparent: true;
opacity: 0;
">

</a-plane>


<!-- มาสคอต -->

<a-image

id="mascotObject"

class="clickable"

src="#mascot"

position="0 -0.25 0.05"

width="0.35"

height="0.6"

transparent="true"

material="
transparent: true;
alphaTest: 0.01;
"

gesture-handler>

</a-image>


</a-entity>


</a-scene>


<script>


const mascot = document.getElementById(
"mascotObject"
);


let originalPosition = {

x: 0,

y: -0.25

};


let originalScale = 1;


// ----------------------------------

// ปรับขนาดมาสคอต

// ----------------------------------

function resizeMascot(amount) {

let currentScale =
mascot.object3D.scale.x;

let newScale =
currentScale * amount;


// จำกัดขนาด

newScale =
Math.max(0.3, Math.min(3, newScale));


mascot.object3D.scale.set(

newScale,

newScale,

newScale

);

}


// ----------------------------------

// รีเซ็ต

// ----------------------------------

function resetMascot() {

mascot.object3D.position.set(

originalPosition.x,

originalPosition.y,

0.05

);


mascot.object3D.scale.set(

1,

1,

1

);

}


// ----------------------------------

// ระบบลากมาสคอต

// ----------------------------------


let dragging = false;


// เริ่มลาก

mascot.addEventListener(

"mousedown",

function(event) {

dragging = true;

}

);


mascot.addEventListener(

"touchstart",

function(event) {

dragging = true;

},

{

passive: false

}

);


// หยุดลาก

window.addEventListener(

"mouseup",

function() {

dragging = false;

}

);


window.addEventListener(

"touchend",

function() {

dragging = false;

}

);


// ----------------------------------

// ลากมาสคอต

// ----------------------------------

window.addEventListener(

"mousemove",

function(event) {

if (!dragging) return;


// ตำแหน่งหน้าจอ

let x =

(event.clientX /

window.innerWidth)

* 2 - 1;


let y =

-(event.clientY /

window.innerHeight)

* 2 + 1;


// จำกัดพื้นที่

// เบื้องต้น

x = Math.max(

-0.45,

Math.min(0.45, x)

);


y = Math.max(

-0.45,

Math.min(0.45, y)

);


// ขยับ

mascot.object3D.position.x = x;

mascot.object3D.position.y = y;

}

);


window.addEventListener(

"touchmove",

function(event) {

if (!dragging) return;

if (event.touches.length === 0) return;


event.preventDefault();


const touch =

event.touches[0];


let x =

(touch.clientX /

window.innerWidth)

* 2 - 1;


let y =

-(touch.clientY /

window.innerHeight)

* 2 + 1;


// จำกัดพื้นที่ป้าย

x = Math.max(

-0.45,

Math.min(0.45, x)

);


y = Math.max(

-0.45,

Math.min(0.45, y)

);


mascot.object3D.position.x = x;

mascot.object3D.position.y = y;

},

{

passive: false

}

);


</script>


</body>

</html>
