<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR Mascot Camera (PNG Version)</title>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <script src="https://hertzen.com"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #selection-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .btn-select {
            padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer;
            border: none; border-radius: 25px; background: #007bff; color: white;
        }
        #ui-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 15px; }
        .control-btn { padding: 12px; border-radius: 50%; border: none; background: white; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #capture-btn { background: #ff4757; color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; }
    </style>
</head>
<body>

    <!-- 1. หน้าจอเลือกตัวละคร -->
    <div id="selection-screen">
        <h2 style="color: white;">เลือกตัวละครมาสคอตของคุณ</h2>
        <button class="btn-select" onclick="selectMascot('mascot1')">ตัวละครที่ 1</button>
        <button class="btn-select" onclick="selectMascot('mascot2')">ตัวละครที่ 2</button>
    </div>

    <!-- 2. ปุ่มควบคุมบนหน้าจอ -->
    <div id="ui-container" style="display: none;">
        <button class="control-btn" onclick="adjustSize(0.1)">➕</button>
        <button class="control-btn" id="capture-btn" onclick="takeSnapshot()">📸</button>
        <button class="control-btn" onclick="adjustSize(-0.1)">➖</button>
    </div>

    <!-- 3. ส่วนกล้อง AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <!-- 💡 จุดใส่ไฟล์รูปภาพ PNG ของคุณ -->
        <a-assets>
            <img id="image1" src="cepar.png">
            <img id="image2" src="cepar.png">
        </a-assets>

        <!-- ตัวรองรับรูปภาพในพื้นที่ AR (หันหน้าเข้าหาผู้ใช้ตลอดเวลาด้วย look-at) -->
        
            <!-- ใช้แผ่นป้ายสี่เหลี่ยมมารับรูปภาพ PNG โดยเปิดระบบโปร่งใส (transparent: true) -->
            <a-image id="active-mascot" src="" width="1" height="1" material="transparent: true; shader: flat;"></a-image>
        

        
    </a-scene>

    <script>
        let currentScale = 1;
        const mascotContainer = document.getElementById('mascot-container');
        const activeMascot = document.getElementById('active-mascot');

        // ฟังก์ชันเลือกตัวละคร
        function selectMascot(type) {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'flex';
            mascotContainer.style.display = 'block';

            if (type === 'mascot1') {
                activeMascot.setAttribute('src', '#image1');
            } else {
                activeMascot.setAttribute('src', '#image2');
            }
        }

        // ฟังก์ชันย่อ-ขยายรูปภาพ
        function adjustSize(amount) {
            currentScale += amount;
            if(currentScale < 0.2) currentScale = 0.2; 
            mascotContainer.setAttribute('scale', `${currentScale} ${currentScale} 1`);
        }

        // ฟังก์ชันลากเปลี่ยนตำแหน่งรูปภาพบนหน้าจอ
        let isDragging = false;
        let previousTouchPosition = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousTouchPosition = { x: e.touches.clientX, y: e.touches.clientY };
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            let deltaX = e.touches.clientX - previousTouchPosition.x;
            let deltaY = e.touches.clientY - previousTouchPosition.y;

            let currentPos = mascotContainer.getAttribute('position');
            // ปรับตำแหน่งตามแนวแกน X และ Y ของหน้าจอ
            mascotContainer.setAttribute('position', {
                x: currentPos.x + (deltaX * 0.005),
                y: currentPos.y - (deltaY * 0.005),
                z: currentPos.z
            });

            previousTouchPosition = { x: e.touches.clientX, y: e.touches.clientY };
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // ฟังก์ชันถ่ายรูปเซฟลงเครื่อง
        function takeSnapshot() {
            document.getElementById('ui-container').style.display = 'none';

            setTimeout(() => {
                html2canvas(document.body).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'ar-snapshot.png';
                    link.href = canvas.toDataURL();
                    link.click();
                    
                    document.getElementById('ui-container').style.display = 'flex';
                });
            }, 300);
        }
    </script>
</body>
</html>
