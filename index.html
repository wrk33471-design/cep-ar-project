<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Mascot on Hand</title>
    
    <!-- โหลดไลบรารี A-Frame และ MindAR สำหรับตรวจจับมือ (Hand Tracking) -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* สไตล์หน้าจอรอโหลด */
        #scanning-overlay {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            color: white; display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; font-family: sans-serif;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- หน้าจอแนะนำให้ผู้ใช้ชูมือขึ้นมา -->
    <div id="scanning-overlay">
        <h2>ระบบ AR พร้อมใช้งาน</h2>
        <p>กรุณาชูฝ่ามือขึ้นมาส่องที่กล้อง</p>
    </div>

    <!-- เริ่มต้นฉาก AR โดยตั้งค่าให้ตรวจจับมือซ้ายหรือขวา (หากเจอจะซ่อนหน้าจอโหลด) -->
    <a-scene mindar-hand="filterMinCF:0.001; filterBeta:15" embedded color-space="sRGB" 
             renderer="colorManagement: true, sortObjects: true" vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false"
             listen-to-ar>
             
        <a-assets>
            <!-- ใส่ลิงก์รูปภาพมาสคอต PNG ของคุณที่นี่ -->
            <img id="mascot-img" src="cepar.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ตั้งค่าจุดยึดบนมือ: ข้อมือ (wrist), กลางฝ่ามือ (palmAnchor), หรือปลายนิ้ว -->
        <!-- ในที่นี้ใช้ palmAnchor เพื่อให้รูปลอยอยู่กลางฝ่ามือพอดี -->
        
            <!-- แสดงรูปภาพ PNG ปรับขนาด (scale) และตำแหน่ง (position) ตามต้องการ -->
            <a-image src="#mascot-img" 
                     position="0 0.1 0" 
                     scale="0.5 0.5 0.5"
                     rotation="0 0 0">
            </a-image>
        

    </a-scene>

    <script>
        // ดักจับเหตุการณ์เมื่อระบบตรวจพบมือ เพื่อซ่อนหน้าจอแนะนำ
        const sceneEl = document.querySelector('a-scene');
        const overlay = document.querySelector('#scanning-overlay');
        
        sceneEl.addEventListener("arReady", (event) => {
            console.log("MindAR พร้อมทำงานแล้ว");
        });

        // ดักจับเมื่อเจอตัวตรวจจับบนมือ
        const handTarget = document.querySelector('[mindar-hand-target]');
        handTarget.addEventListener("targetFound", event => {
            overlay.classList.add("hidden");
        });
        
        handTarget.addEventListener("targetLost", event => {
            overlay.classList.remove("hidden");
        });
    </script>
</body>
</html>
