<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Mascot</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- เปลี่ยนตรง mascot.glb ให้ตรงกับชื่อไฟล์ 3D ของคุณ -->
    <model-viewer 
        src="cepar.png" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        alt="A 3D mascot">
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px; font-weight: bold; cursor: pointer;">
            👋 ดูโหมด AR
        </button>
    </model-viewer>
</body>
</html>
